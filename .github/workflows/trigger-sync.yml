name: Trigger deck-main sync

on:
  push:
    branches:
      - main

jobs:
  trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger repository_dispatch event on deck-main
        run: |
          curl -i -X POST https://api.github.com/repos/AdnanRasool128/deck-main/dispatches \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: token ${{ secrets.SYNC_PAT }}" \
          -H "Content-Type: application/json" \
          -d '{"event_type": "sync"}'

